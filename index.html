<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BuildTrack" />
<title>BuildTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Mono:wght@400;500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ═══ Design tokens — the single source of truth (see docs/UI-REVAMP-SPEC.md §3).
   Components use these variables only; no hex colors inside components. ═══ */
:root {
  /* surfaces */
  --bg:            #0b0c0e;
  --surface:       #121419;
  --border:        #1f2329;
  --border-strong: #2a2f37;
  --scrim:         rgba(0,0,0,0.6);

  /* text */
  --text:   #eceef1;
  --text-2: #b3bac5;
  --text-3: #8b93a1;
  --text-4: #6b7382;
  --text-5: #3a404a;

  /* meaning (use sparingly) */
  --attn:        #f5b544;
  --attn-wash:   rgba(245,181,68,0.12);
  --attn-border: rgba(245,181,68,0.35);
  --done:        #5fbf8a;
  --danger:      #f87171;

  /* primary button */
  --primary-bg: #eceef1;
  --primary-fg: #0b0c0e;

  /* type */
  --font-display: "Barlow Condensed", sans-serif;
  --font-body:    "Geist", -apple-system, sans-serif;
  --font-mono:    "DM Mono", ui-monospace, monospace;

  /* shape */
  --radius-card: 12px;
  --radius-tile: 10px;
  --radius-btn:  10px;
  --radius-chk:  6px;
  --tap: 44px;
  --tap-primary: 52px;
  --gutter: 16px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; }
body { font-family: var(--font-body); font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
input, textarea, button, select, a { font-family: inherit; font-size: inherit; color: inherit; }
button { background: none; border: none; cursor: pointer; outline: none; }
button:disabled { cursor: default; }
a { text-decoration: none; }
input[type="date"]::-webkit-calendar-picker-indicator,
input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(0.6); cursor: pointer; }
::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: var(--bg); } ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }
.mono { font-family: var(--font-mono); }

/* ── Layout ── */
.app { min-height: 100vh; }
.app.has-tabs { padding-bottom: calc(64px + var(--safe-b)); }
.app.has-actions { padding-bottom: calc(76px + var(--safe-b)); }
.page { max-width: 640px; margin: 0 auto; padding: 16px var(--gutter) 32px; }
.stack { display: flex; flex-direction: column; gap: 20px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.grow { flex: 1; min-width: 0; }

/* ── Header ── */
.hdr { position: sticky; top: 0; z-index: 50; background: var(--bg); border-bottom: 1px solid var(--border);
  padding: var(--safe-t) var(--gutter) 0; }
.hdr-in { height: 52px; max-width: 640px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.1em; color: var(--text-2); }
.logo-mark { width: 18px; height: 18px; border-radius: 5px; background: var(--text); display: grid; place-items: center; }
.logo-mark::after { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--bg); }
.back { display: inline-flex; align-items: center; gap: 2px; min-height: var(--tap); padding-right: 8px; color: var(--text-3); font-size: 14px; }
.hdr-right { display: flex; align-items: center; gap: 4px; }
.hdr-meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; color: var(--text-4); padding: 0 6px; white-space: nowrap; }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-5); flex-shrink: 0; }
.sync.ok .sync-dot { background: var(--done); }
.sync.busy .sync-dot { background: var(--text-3); animation: pulse 1s ease-in-out infinite; }
.sync.bad { color: var(--attn); } .sync.bad .sync-dot { background: var(--attn); }
@keyframes pulse { 50% { opacity: 0.3; } }

/* ── Bottom tab bar ── */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: var(--bg); border-top: 1px solid var(--border); padding-bottom: var(--safe-b); }
.tabbar-in { height: 64px; max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: var(--text-4);
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; transition: color 0.15s; }
.tab.on { color: var(--text); }
/* Punch section: a slow tap on a phone must never read as a long-press text
   selection (PunchTrack's CLAUDE.md, fixed there once already). */
.pt button, .pt .btn { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }

/* ── Bottom action bar ── */
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: var(--bg); border-top: 1px solid var(--border); padding: 10px var(--gutter) calc(10px + var(--safe-b)); }
.actionbar-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }

/* ── Type ── */
.title { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.05; letter-spacing: 0.01em; }
.title-house { font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1.05; }
.cap { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); }
.label { font-size: 13px; font-weight: 500; color: var(--text-2); }
.hint { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--text-4); text-transform: uppercase; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.attn-text { color: var(--attn); }

/* ── Grouped list card ── */
.card { border: 1px solid var(--border); border-radius: var(--radius-card); overflow: hidden; }
.card.attn { border-color: var(--attn-border); }
.row { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 12px 14px; background: var(--surface); }
.row + .row { border-top: 1px solid var(--border); }
.row.tap { cursor: pointer; transition: background 0.12s; }
.row.tap:active { background: var(--border); }
.row-title { font-size: 15px; font-weight: 500; color: var(--text); overflow-wrap: anywhere; }
.row-title.sm { font-size: 14px; }
.row-meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); margin-top: 3px; }
.row-meta.attn { color: var(--attn); }
.row-right { flex-shrink: 0; text-align: right; }
.card-head { padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

/* ── Countdown ── */
.count { font-family: var(--font-mono); font-size: 13px; color: var(--text-3); white-space: nowrap; }
.count.attn { color: var(--attn); }
.count-big { font-family: var(--font-mono); font-size: 26px; line-height: 1; color: var(--text); text-align: right; }
.count-big.attn { color: var(--attn); }
.count-big.none { color: var(--text-5); }

/* ── Chips ── */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; font-family: var(--font-mono); font-size: 11px;
  padding: 6px 10px; border: 1px solid var(--border); color: var(--text-3); white-space: nowrap; }
.chip.attn { background: var(--attn-wash); border-color: var(--attn-border); color: var(--attn); }
button.chip { min-height: 36px; padding: 0 14px; position: relative; }
button.chip::after { content: ""; position: absolute; inset: -4px 0; } /* 44px tap area, slim look */
button.chip.on { border-color: var(--text); color: var(--text); }

/* ── Buttons ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 16px;
  border-radius: var(--radius-btn); font-size: 14px; font-weight: 600; white-space: nowrap; transition: opacity 0.15s; }
.btn:disabled { opacity: 0.4; }
.btn-lg { min-height: var(--tap-primary); }
.btn-block { width: 100%; }
.btn-primary { background: var(--primary-bg); color: var(--primary-fg); }
.btn-secondary { border: 1px solid var(--border-strong); color: var(--text); }
.btn-danger { border: 1px solid var(--danger); color: var(--danger); }
.btn-sm { min-height: var(--tap); padding: 0 12px; font-size: 13px; }
.icon-btn { width: var(--tap); height: var(--tap); display: inline-grid; place-items: center; color: var(--text-3); border-radius: var(--radius-btn); flex-shrink: 0; }
.icon-btn:active { background: var(--border); }
.btn-row { display: flex; gap: 8px; }
.btn-row > * { flex: 1; }

/* ── Inputs ── */
.input { width: 100%; min-height: var(--tap); padding: 0 12px; background: var(--bg); border: 1px solid var(--border-strong); border-radius: 8px;
  color: var(--text); font-size: 14px; outline: none; color-scheme: dark; }
.input:focus { border-color: var(--text-3); }
textarea.input { padding: 10px 12px; resize: vertical; line-height: 1.45; }
select.input { appearance: none; -webkit-appearance: none; padding-right: 30px;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%);
  background-position: calc(100% - 17px) 19px, calc(100% - 12px) 19px; background-size: 5px 5px; background-repeat: no-repeat; }
.input.date { width: 150px; font-family: var(--font-mono); font-size: 13px; padding: 0 10px; }
.input.time { width: 118px; font-family: var(--font-mono); font-size: 13px; padding: 0 10px; }
.input.select-sm { width: auto; font-size: 13px; }
.input-address { width: 100%; min-height: var(--tap); background: transparent; border: none; border-bottom: 1px dashed var(--border-strong); outline: none; padding: 0 0 4px; }
.field-label { display: block; font-size: 12px; color: var(--text-3); margin-bottom: 6px; }
.fields { display: flex; flex-direction: column; gap: 12px; }
.fields-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ── Switch ── */
.switch::before { content: ""; position: absolute; inset: -8px -2px; } /* 44px tap area */
.switch { width: 46px; height: 28px; border-radius: 999px; border: 1px solid var(--border-strong); position: relative; flex-shrink: 0; transition: background 0.15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--text-3); transition: transform 0.15s, background 0.15s; }
.switch.on { background: var(--text); border-color: var(--text); }
.switch.on::after { transform: translateX(18px); background: var(--bg); }

/* ── Scope item checkbox ── */
button.chk { position: relative; }
button.chk::before { content: ""; position: absolute; inset: -12px; } /* 44px tap area around the 20px box */
.chk { width: 20px; height: 20px; border-radius: var(--radius-chk); flex-shrink: 0; display: grid; place-items: center; }
.chk.pending { border: 1.5px dashed var(--attn); }
.chk.off { border: 1.5px solid var(--border-strong); }
.chk.sent { border: 1.5px solid var(--text-3); }
.chk.sent::after { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--text-3); }
.chk.done { background: var(--done); color: var(--bg); }
.item-done .row-title { text-decoration: line-through; color: var(--text-4); }

/* ── Bonus toggles ── */
.bon-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.bon { min-height: var(--tap); border-radius: 8px; border: 1px solid var(--border-strong); display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; color: var(--text-3); gap: 1px; }
.bon small { font-size: 10px; color: var(--text-4); letter-spacing: 0; }
.bon.on { background: var(--text); border-color: var(--text); color: var(--bg); }
.bon.on small { color: var(--bg); opacity: 0.7; }
.bon.na { border-color: var(--border); color: var(--text-5); }
.bon.na small { color: var(--text-5); }

/* ── Sheet (bottom modal) ── */
.scrim { position: fixed; inset: 0; z-index: 100; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; animation: fade 0.15s; }
.sheet { width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-bottom: none;
  border-radius: 16px 16px 0 0; padding: 8px var(--gutter) calc(16px + var(--safe-b)); animation: rise 0.18s ease-out; }
.sheet-grab { width: 36px; height: 4px; border-radius: 2px; background: var(--border-strong); margin: 0 auto 12px; }
.sheet-title { font-family: var(--font-display); font-weight: 700; font-size: 24px; margin-bottom: 4px; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }

/* ── KPI tiles ── */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { border: 1px solid var(--border); border-radius: var(--radius-tile); padding: 12px; min-width: 0; }
.kpi-label { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-value { font-family: var(--font-mono); font-size: 24px; line-height: 1.2; margin: 4px 0 2px; }
.kpi-sub { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── Progress rings ── */
.rings { display: flex; gap: 6px; flex-shrink: 0; }
.ring { display: block; }
.ring-track { fill: none; stroke: var(--border); stroke-width: 3; }
.ring-arc { fill: none; stroke: var(--text); stroke-width: 3; stroke-linecap: round; transition: stroke-dasharray 0.3s; }
.ring.attn .ring-arc { stroke: var(--attn); }
.ring.attn .ring-track { stroke: var(--attn-wash); }
.ring-none { width: 26px; height: 26px; display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; color: var(--text-5); }

/* ── Underline tabs (house page) ── */
.utabs { display: flex; gap: 22px; border-bottom: 1px solid var(--border); }
.utab { min-height: var(--tap); display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text-3); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.utab.on { color: var(--text); font-weight: 500; border-bottom-color: var(--text); }
.utab .n { font-family: var(--font-mono); font-size: 11px; color: var(--text-4); font-weight: 400; }
.utab .n.attn { color: var(--attn); }

/* ── Misc ── */
.empty { padding: 40px 16px; text-align: center; color: var(--text-3); font-size: 14px; }
.notice { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; padding: 10px 12px; border-radius: var(--radius-tile);
  background: var(--attn-wash); border: 1px solid var(--attn-border); color: var(--attn); }
.panel { border: 1px solid var(--border); border-radius: var(--radius-card); padding: 20px 16px; background: var(--surface); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 3px; border: 1px solid var(--border-strong); border-radius: var(--radius-btn); }
.seg button { min-height: var(--tap); border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--text-3); }
.seg button.on { background: var(--text); color: var(--bg); }
.menu { position: absolute; right: var(--gutter); top: calc(52px + var(--safe-t)); z-index: 70; min-width: 200px; background: var(--surface);
  border: 1px solid var(--border-strong); border-radius: var(--radius-tile); overflow: hidden; }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: var(--tap); padding: 0 14px; font-size: 14px; text-align: left; }
.menu button + button { border-top: 1px solid var(--border); }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.print-only { display: none; }

/* Printing the app itself: plain, light, paper-friendly. */
@media print {
  :root { --bg: #fff; --surface: #fff; --text: #111; --text-2: #333; --text-3: #555; --text-4: #666; --border: #ccc; }
  .no-print, .tabbar, .actionbar, .hdr { display: none !important; }
  .print-only { display: block !important; }
  .app { padding: 0 !important; }
}
</style>
</head>

<script>
  window.addEventListener("error", function (e) {
    var root = document.getElementById("root");
    if (root) {
      root.innerHTML =
        '<div style="font-family:var(--font-mono);font-size:12px;margin:16px;padding:16px;border-radius:10px;color:var(--attn);background:var(--attn-wash);border:1px solid var(--attn-border);white-space:pre-wrap;">' +
        "SCRIPT ERROR:\n" + (e.message || e) + "\n\nFile: " + (e.filename || "?") + " Line: " + (e.lineno || "?") +
        "</div>";
    }
  });
</script>

<!-- No build step: React + htm (tagged-template JSX alternative, ~1 KB) run the

const html = htm.bind(React.createElement);


const { useState, useEffect, useRef, useCallback } = React;

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyOD3tU4NA9Rq8hBeCkgtcelQ6S5Ze1CQXfX2alC3bwgA-oB2sRCbzs_GJv1PWw5B6o/exec';

const MILESTONES = [
  { key:'tempElectric', label:'Temp Electrical Service',   sublabel:'Ordered'    },
  { key:'gasRiser',     label:'Gas Riser',                  sublabel:'Ordered'    },
  { key:'roughIn',      label:'Rough-In Inspection',        sublabel:'Passed'     },
  { key:'permElectric', label:'Permanent Electrical Meter', sublabel:'Ordered'    },
  { key:'permGas',      label:'Permanent Gas Meter',        sublabel:'Ordered'    },
  { key:'co',           label:'Certificate of Occupancy',   sublabel:'Received'   },
  { key:'walkthrough',  label:'Walkthrough',                sublabel:'Date & Time'},
  { key:'finalClean',   label:'Final Clean',                sublabel:'Scheduled'  },
  { key:'closing',      label:'Closing',                    sublabel:'Date'       },
];

const BONUS_DEFS = [
  { key:'roughIn',  label:'Rough-In Bonus',      abbr:'R/I',   milestoneKey:'roughIn'  },
  { key:'co',       label:'CO Bonus',             abbr:'CO',    milestoneKey:'co'       },
  { key:'closing',  label:'Closing Bonus',        abbr:'CLOSE', milestoneKey:'closing'  },
  { key:'basement', label:'Basement Finish Bonus',abbr:'BSMT',  milestoneKey:null, requiresBasement:true },
];

// ── Helpers ──────────────────────────────────────────────────────
const genId   = () => Date.now().toString(36) + Math.random().toString(36).substr(2);
const fmtDate = d => d ? new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : null;
const fmtShort= d => d ? new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}) : null;
const daysTo  = d => { if (!d) return null; const t=new Date(); t.setHours(0,0,0,0); return Math.round((new Date(d+'T00:00:00')-t)/86400000); };
const fmtTime = t => { if (!t) return null; const [h,m]=t.split(':').map(Number); return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`; };
const bonusFor= h => BONUS_DEFS.filter(b => b.requiresBasement ? h.basementFinish : true);
const eligible= (h,b)=> b.requiresBasement ? (h.basementFinish && !!h.milestones.closing && daysTo(h.milestones.closing)<=0) : (!!h.milestones[b.milestoneKey] && daysTo(h.milestones[b.milestoneKey])<=0);

function buildIcsContent(address, date, time) {
  const dt=date.replace(/-/g,''), st=time.replace(':','')+'00';
  const h=parseInt(time.split(':')[0]), mn=time.split(':')[1];
  const et=`${String((h+1)%24).padStart(2,'0')}${mn}00`;
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//BuildTrack//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VEVENT',`UID:${dt}-${st}-bt@local`,`DTSTART:${dt}T${st}`,`DTEND:${dt}T${et}`,
    `SUMMARY:Walkthrough \u2013 ${address}`,`DESCRIPTION:Home walkthrough at ${address}`,
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
}

// iOS Safari has gotten increasingly strict about following data: URI link taps
// (a plain <a href="data:..."> tap can silently do nothing). A Blob object URL
// triggered by a programmatic click is the reliable way to get the Calendar
// add-event sheet to open instead.
function downloadIcs(address, date, time) {
  const ics = buildIcsContent(address, date, time);
  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `walkthrough-${date}.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

const configured = () => SCRIPT_URL !== 'YOUR_SCRIPT_URL_HERE';

async function sheetsLoad() {
  return withRetry(async () => {
    const res = await fetch(`${SCRIPT_URL}?t=${Date.now()}&token=${encodeURIComponent(BUILDTRACK_APP_TOKEN)}`);
    const data = await res.json();
    // A bad/missing token comes back as {houses: [], error: "..."} — indistinguishable
    // from a genuinely empty sheet by shape alone, so an unchecked error here would
    // make the app show zero houses and overwrite the localStorage backup with
    // nothing. Treat any error as a load failure instead, same as a network error.
    if (data.error) throw new Error(data.error);
    return Array.isArray(data.houses) ? data.houses : null;
  });
}

async function sheetsSave(houses) {
  return withRetry(async () => {
    const res = await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({ houses, token: BUILDTRACK_APP_TOKEN }) });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Save failed');
  });
}

// ── House helpers ────────────────────────────────────────────────
const doneCount = h => MILESTONES.filter(m => h.milestones[m.key]).length;
const owedCount = h => bonusFor(h).filter(b => !h.bonuses[b.key] && eligible(h, b)).length;
const subLine   = h => [h.subdivision, h.lotNumber && `Lot ${h.lotNumber}`].filter(Boolean).join(' · ');
const countdown = d => d === null ? '—' : d === 0 ? 'Today' : d < 0 ? `${-d}d ago` : `${d}d`;
function sortByClosing(list) {
  return [...list].sort((a, b) => {
    const ac = a.milestones.closing, bc = b.milestones.closing;
    if (!ac && !bc) return 0; if (!ac) return 1; if (!bc) return -1;
    return new Date(ac) - new Date(bc);
  });
}
// The single most urgent fact for a house, in Chris's Q3 priority order:
//  1) closing ≤14d with no Final Clean date   2) closing ≤14d with no walkthrough
//  3) a scope item not sent                   4) a scope item sent (communicated)
//     but not marked out for ≥7 days          5) on track
// `sj` is this house's scope-job summary (or undefined if no job / not loaded).
const SENT_STALE_DAYS = 7;
const daysSince = iso => iso ? -daysTo(iso) : null;
function houseFact(h, sj) {
  const d = daysTo(h.milestones.closing);
  const closes = d === null ? null : d === 0 ? 'Closes today' : d > 0 ? `Closes in ${d}d` : `Closing was ${-d}d ago`;
  if (d !== null && d >= 0 && d <= 14) {
    if (!h.milestones.finalClean)  return { text: `${closes} · no clean scheduled`, attn: true };
    if (!h.milestones.walkthrough) return { text: `${closes} · no walkthrough set`, attn: true };
  }
  if (hasCounts(sj) && sj.notSent > 0) return { text: `${sj.notSent} scope item${sj.notSent > 1 ? 's' : ''} not sent`, attn: true, scope: true };
  const stale = hasCounts(sj) ? daysSince(sj.oldestSentNoReplyDate) : null;
  if (stale !== null && stale >= SENT_STALE_DAYS) return { text: `Scope sent ${stale}d ago · not marked out`, attn: true, scope: true };
  if (d === null) return { text: `No closing date · ${doneCount(h)}/${MILESTONES.length} milestones`, attn: false };
  return { text: d >= 0 ? `${closes} · on track` : closes, attn: false };
}
// Does this house's scope job need attention (rules 3–4), regardless of which fact won?
function scopeNeedsAttn(sj) {
  if (!hasCounts(sj)) return false;
  const stale = daysSince(sj.oldestSentNoReplyDate);
  return sj.notSent > 0 || (stale !== null && stale >= SENT_STALE_DAYS);
}
function milestonesNeedAttn(h) {
  const d = daysTo(h.milestones.closing);
  return d !== null && d >= 0 && d <= 14 && (!h.milestones.finalClean || !h.milestones.walkthrough);
}

// ── Progress ring (em-dash when the house has no job in that tool) ─
function Ring({ pct, attn, label }) {
  if (pct === null || pct === undefined) return html`<span className="ring-none" aria-label=${label + ': no job'}>—</span>`;
  const c = 2 * Math.PI * 10, p = Math.max(0, Math.min(1, pct));
  return html`<svg className=${'ring' + (attn ? ' attn' : '')} width="26" height="26" viewBox="0 0 26 26" role="img" aria-label=${`${label} ${Math.round(p * 100)}%`}>
    <circle className="ring-track" cx="13" cy="13" r="10" />
    ${p > 0 && html`<circle className="ring-arc" cx="13" cy="13" r="10" strokeDasharray=${`${c * p} ${c}`} transform="rotate(-90 13 13)" />`}
  </svg>`;
}
const scopePct = sj => !sj ? null : !hasCounts(sj) ? null : sj.total === 0 ? 0 : sj.done / sj.total;

function KpiTile({ label, value, sub, attn }) {
  return html`<div className="kpi"><div className="kpi-label">${label}</div><div className="kpi-value">${value}</div>
    <div className=${'kpi-sub' + (attn ? ' attn-text' : '')}>${sub}</div></div>`;
}

// ── Today ────────────────────────────────────────────────────────
function TodayScreen({ houses, jobs, punchJobs, onOpen }) {
  const list = sortByClosing(houses);
  const date = new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  const sjs = list.map(h => jobForHouse(h, jobs));
  const counted = sjs.filter(hasCounts);
  const open = counted.reduce((s, j) => s + j.notSent + j.sent, 0);
  const unsent = counted.reduce((s, j) => s + j.notSent, 0);
  const closingSoon = list.filter(h => { const d = daysTo(h.milestones.closing); return d !== null && d >= 0 && d <= 14; });
  const next = closingSoon[0];
  const nextDay = next ? new Date(next.milestones.closing + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short' }) : null;
  const countsKnown = jobs.some(hasCounts);
  const pjs = list.map(h => punchForHouse(h, punchJobs));
  const punchKnown = punchJobs.some(ptHasCounts);
  const punchOpen = pjs.filter(ptHasCounts).reduce((s, j) => s + j.open, 0);
  const needVisit = list.filter((h, i) => ptVisitStatus(pjs[i], h.milestones.closing).overdue).length;
  return html`<div className="page stack">
    <div><div className="cap">${date}</div><h1 className="title">${list.length} active home${list.length === 1 ? '' : 's'}</h1></div>
    <div className="kpis">
      <${KpiTile} label="Scope open" value=${countsKnown ? open : '—'} sub=${!countsKnown ? 'Counts pending' : unsent > 0 ? `${unsent} unsent` : 'All sent'} attn=${unsent > 0} />
      <${KpiTile} label="Punch open" value=${punchKnown ? punchOpen : '—'} sub=${!punchKnown ? 'Counts pending' : needVisit > 0 ? `${needVisit} need a visit` : 'All checked'} attn=${needVisit > 0} />
      <${KpiTile} label="Closing ≤14d" value=${closingSoon.length} sub=${next ? `next ${nextDay}` : 'None soon'} />
    </div>
    <div>
      <div className="section-head"><span className="label">Houses</span><span className="hint">MLS · Scope · Punch</span></div>
      ${list.length === 0 ? html`<${Empty} text="No active homes yet. Add one from the Houses tab." />` : html`
      <div className="card">
        ${list.map((h, i) => { const sj = sjs[i], pj = pjs[i], f = houseFact(h, sj); return html`
          <div key=${h.id} className="row tap" onClick=${() => onOpen(h.id)}>
            <div className="grow"><div className="row-title">${h.address}</div><div className=${'row-meta' + (f.attn ? ' attn' : '')}>${f.text}</div></div>
            <div className="rings">
              <${Ring} label="Milestones" pct=${doneCount(h) / MILESTONES.length} attn=${milestonesNeedAttn(h)} />
              <${Ring} label="Scope" pct=${scopePct(sj)} attn=${scopeNeedsAttn(sj)} />
              <${Ring} label="Punch" pct=${punchPct(pj)} attn=${ptVisitStatus(pj, h.milestones.closing).overdue} />
            </div>
          </div>`; })}
      </div>`}
    </div>
  </div>`;
}

  if (sortBy === 'closing') return sortByClosing(houses);
  if (sortBy === 'pct') return [...houses].sort((a, b) => doneCount(b) - doneCount(a));

}

// copied into BuildTrack's sheet. (Spec: PunchTrack repo,
// SPEC-Integration-and-LastChecked.md, Part 1.)
//
// PunchTrack's own page stays live for a trial period; both read and write the
// same sheet, so either one shows the same data.
//
// Like every tool's token, this one is visible in page source by design — rate
// limiting on PunchTrack's backend is the real protection (CLAUDE.md).
const PUNCHTRACK_URL = 'https://chrisdavidson98.github.io/PunchTrack/';
const PUNCH_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzHpWKcsT9w01rxs4wzrtfI-G2dbrp6LsPkX3x_W2KR8AyLFVsaszQBwUh6f4l01wr74g/exec';
const PUNCH_APP_TOKEN = 'pWojP7euA3jW-E8XNYYr4TQZDPFfJxnh';

async function punchGet(params) {
  const url = new URL(PUNCH_SCRIPT_URL);
  Object.entries({ token: PUNCH_APP_TOKEN, ...params }).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url.toString());
  const data = await res.json();
  if (data && data.error) throw new Error(data.error);
  return data;
}
// text/plain on purpose — see backendPost above.
async function punchPost(action, payload) {
  const res = await fetch(PUNCH_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, token: PUNCH_APP_TOKEN, ...payload }),
  });
  const data = await res.json();
  if (data && data.error) throw new Error(data.error);
  return data;
}

// Mirrors isPrieb in PunchTrack's Code.gs and index.html — keep all three alias
// lists in sync. The in-house lane is chosen by assignee name.
const PT_PRIEB_ALIASES = ['prieb', 'prieb homes', 'preib', 'in-house', 'in house', 'inhouse'];
const ptIsPrieb = a => PT_PRIEB_ALIASES.indexOf(String(a || '').trim().toLowerCase()) !== -1;

// PunchTrack dates arrive as "YYYY-MM-DD" or a full ISO timestamp; BuildTrack's
// fmtDate/fmtShort want the plain day.
const ptDay = d => { const s = String(d || '').slice(0, 10); return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : ''; };
const ptFmt = d => fmtDate(ptDay(d)) || '';
const ptShort = d => { const s = ptDay(d); return s ? `${+s.slice(5, 7)}/${+s.slice(8, 10)}` : ''; };
function ptToday() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
const ptIsWorkday = d => d.getDay() !== 0 && d.getDay() !== 6;
function ptWorkdaysSince(day) {
  if (!ptDay(day)) return null;
  const d = new Date(ptDay(day) + 'T00:00:00'), today = new Date(ptToday() + 'T00:00:00');
  let n = 0;
  while (d < today) { d.setDate(d.getDate() + 1); if (ptIsWorkday(d)) n++; }
  return n;
}
// Trade deadline = 2 working days before closing (same as PunchTrack's report).
function ptWorkingDaysBefore(day, n) {
  if (!ptDay(day)) return null;
  const d = new Date(ptDay(day) + 'T00:00:00');
  while (n > 0) { d.setDate(d.getDate() - 1); if (ptIsWorkday(d)) n--; }
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// "Last checked" + overdue, same rule as PunchTrack's visitStatus (workdays only,
// never flagged on a weekend):  >14d to close or no date → 3+ · 8–14d → 2+ · ≤7d → 1+
// A badge only — it never reorders anything.
function ptVisitStatus(pj, closing) {
  if (!pj) return { last: '', label: '', overdue: false };
  const visits = pj.visits || [];
  const last = ptDay(pj.lastVisit) || (visits.length ? visits[visits.length - 1].date : '');
  const since = last || ptDay(pj.createdAt);
  const d = daysTo(ptDay(pj.closingDate) || ptDay(closing) || null);
  const limit = d === null || d > 14 ? 3 : d >= 8 ? 2 : 1;
  const ago = ptWorkdaysSince(since);
  const overdue = !pj.archived && ptIsWorkday(new Date()) && ago !== null && ago >= limit;
  const label = !last ? 'Never checked' : last === ptToday() ? 'Checked today' : `Last checked ${fmtShort(last)}`;
  return { last, label, overdue };
}
const ptOpenTrail = (visits, id) => (visits || []).filter(v => (v.openItemIds || []).indexOf(id) !== -1).map(v => v.date);
const ptHasCounts = pj => !!pj && typeof pj.total === 'number';
const punchPct = pj => !ptHasCounts(pj) ? null : pj.total === 0 ? 0 : pj.done / pj.total;
function ptSummarize(job) {
  const total = job.items.length, done = job.items.filter(it => it.status === 'completed').length;
  const visits = job.visits || [];
  return { slug: job.slug, address: job.address, closingDate: job.closingDate, createdAt: job.createdAt, archived: job.archived,
    lastVisit: job.lastVisit || (visits.length ? visits[visits.length - 1].date : ''), total, done, open: total - done };
}
// A house's walkthrough, matched on street address like its scope job.
// An active job wins over an archived one at the same address.
const punchForHouse = (h, jobs) => jobForHouse(h, jobs.filter(j => !j.archived)) || jobForHouse(h, jobs);

// Helper-list text: plain "Room: Item" lines under each address, nothing else.

// ── .md house archive (same format as PunchTrack's EXPORT) ─────────
const PT_STATUS_LABEL = { assignable: 'open, not yet sent', sent: 'sent to trade, not confirmed done', self_assigned: 'open — Chris', flagged: 'flagged, needs a decision', completed: 'done' };
function ptArchiveMarkdown(job, now = new Date()) {
  const items = job.items || [], visits = job.visits || [];
  const order = [], by = {};
  items.forEach(it => { const w = it.assignee || 'Unassigned'; if (!by[w]) { by[w] = []; order.push(w); } by[w].push(it); });
  const done = items.filter(it => it.status === 'completed').length;
  const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  const lines = [
    `# ${job.address}`,
    `Walkthrough Items — generated ${ptFmt(today)}`,
    job.closingDate ? `Closing ${ptFmt(job.closingDate)}` : 'Closing date not set',
    `${items.length} items logged — ${done} done, ${items.length - done} still open`,
    visits.length ? `${visits.length} visit${visits.length === 1 ? '' : 's'} logged — ${visits.map(v => ptFmt(v.date)).join(', ')}` : 'No visits logged',
  ];
  order.forEach(w => {
    lines.push('', `## ${w}`);
    by[w].forEach(it => {
      const dates = [];
      if (it.dateLogged) dates.push(`logged ${ptFmt(it.dateLogged)}`);
      if (it.dateSent) dates.push(`sent ${ptFmt(it.dateSent)}`);
      if (it.dateCompleted) dates.push(`completed ${ptFmt(it.dateCompleted)}`);
      lines.push(`- ${it.room}: ${it.item} [${PT_STATUS_LABEL[it.status] || it.status || 'open'}]${dates.length ? ' — ' + dates.join(', ') : ''}`);
      if (it.notes) lines.push(`  - ${it.notes}`);
      const trail = ptOpenTrail(visits, it.id);
      if (trail.length) lines.push(`  - still open on: ${trail.map(ptFmt).join(', ')}`);
    });
  });
  return lines.join('\n') + '\n';
}
function ptDownloadMarkdown(job) {
  const now = new Date(), p = n => String(n).padStart(2, '0');
  const name = `${slugify(job.address)}-punchlist-${now.getFullYear()}-${p(now.getMonth() + 1)}-${p(now.getDate())}-${p(now.getHours())}${p(now.getMinutes())}.md`;
  const url = URL.createObjectURL(new Blob([ptArchiveMarkdown(job, now)], { type: 'text/markdown;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// ── Punch job list (stale-while-revalidate, same rules as scope) ────
const PUNCH_JOBS_KEY = 'bt_punch_jobs';
function usePunchJobs() {
  const [jobs, setJobsState] = useState(() => { try { return JSON.parse(localStorage.getItem(PUNCH_JOBS_KEY)); } catch (e) { return null; } });
  const [loading, setLoading] = useState(true);
  const [failed, setFailed] = useState(false);
  const setJobs = useCallback(fn => setJobsState(prev => {
    const next = fn(prev || []);
    try { localStorage.setItem(PUNCH_JOBS_KEY, JSON.stringify(next)); } catch (e) {}
    return next;
  }), []);
  useEffect(() => {
    (async () => {
      try {
        const result = await withRetry(() => punchGet({ action: 'listJobs' }));
        setJobs(() => Array.isArray(result) ? result : []);
      } catch (e) { setFailed(true); }
      finally { setLoading(false); }
    })();
  }, []);
  const updateSummary = useCallback(job => setJobs(js => js.map(j => j.slug === job.slug ? { ...j, ...ptSummarize(job) } : j)), []);
  return { jobs: jobs || [], loading: loading && jobs === null, failed, setJobs, updateSummary };
}

// Walkthroughs are cached per device so they open instantly. Like scope jobs,
// the cached copy is VIEW-ONLY until the fresh copy arrives — acting on a stale
// copy could re-complete an item already changed on another device or log a
// visit against old data. Every write below checks freshRef first.
const punchJobKey = slug => 'bt_punch_job_' + slug;
const readCachedPunch = slug => { try { const s = localStorage.getItem(punchJobKey(slug)); return s ? JSON.parse(s) : null; } catch (e) { return null; } };

function PunchJobScreen({ slug, embedded, backLabel, onBack, onChange }) {
  const [job, setJob] = useState(() => readCachedPunch(slug));
  const [fresh, setFresh] = useState(false);
  const freshRef = useRef(false);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);
  const [error, setError] = useState(null);
  const [sheet, setSheet] = useState(null); // null | 'dictate' | 'review' | {item} | {report}
  const [dictation, setDictation] = useState('');
  const [processing, setProcessing] = useState(false);
  const [pending, setPending] = useState([]);
  const [pendingClosing, setPendingClosing] = useState(null);
  const [copied, setCopied] = useState(false);

  const load = async () => {
    setLoading(true); setLoadError(null);
    try { setJob(await withRetry(() => punchGet({ action: 'getJob', slug }))); freshRef.current = true; setFresh(true); }
    catch (e) { setLoadError(`Couldn't load this walkthrough (${e.message || 'backend error'}).`); }
    finally { setLoading(false); }
  };
  useEffect(() => { load(); }, [slug]);
  useEffect(() => { if (job && fresh && onChange) onChange(job); }, [job, fresh]);
  // Only a fresh (or freshly edited) copy is written back to the cache.
  useEffect(() => { if (job && fresh) { try { localStorage.setItem(punchJobKey(slug), JSON.stringify(job)); } catch (e) {} } }, [job, fresh]);

  const patchLocal = (id, patch) => setJob(j => j && { ...j, items: j.items.map(it => it.id === id ? { ...it, ...patch } : it) });
  // Mirror of PunchTrack's backend logVisit, so "Checked today" and the trails
  // update the instant something counts as a visit. Queue it after the item patch.
  const visitLocal = completedId => setJob(j => {
    if (!j) return j;
    const today = ptToday(), visits = (j.visits || []).slice();
    const i = visits.findIndex(v => v.date === today);
    const was = i >= 0 ? visits[i] : { date: today, openItemIds: [], completedItemIds: [] };
    const doneIds = completedId && was.completedItemIds.indexOf(completedId) === -1 ? was.completedItemIds.concat(completedId) : was.completedItemIds;
    const next = { date: today, completedItemIds: doneIds, openItemIds: j.items.filter(it => it.status !== 'completed' && doneIds.indexOf(it.id) === -1).map(it => it.id) };
    if (i >= 0) visits[i] = next; else visits.push(next);
    return { ...j, visits, lastVisit: today };
  });

  // Patch the screen first, then write; roll back on failure. Waiting on the
  // round-trip before updating is what caused PunchTrack's long-press misfire.
  const optimistic = async (id, patch, write, msg) => {
    if (!freshRef.current) return;
    setError(null);
    const before = job.items.find(it => it.id === id);
    const rollback = {};
    if (before) Object.keys(patch).forEach(k => { rollback[k] = before[k] === undefined ? '' : before[k]; });
    patchLocal(id, patch);
    try { await withRetry(write); }
    catch (e) { if (before) patchLocal(id, rollback); setError(`${msg} (${e.message}).`); }
  };
  const complete = it => {
    if (!freshRef.current) return;
    const patch = { status: 'completed', dateCompleted: new Date().toISOString() };
    const w = optimistic(it.id, patch, () => punchPost('updateItem', { item: { id: it.id, ...patch } }), "Couldn't mark complete");
    visitLocal(it.id); // completing counts as a visit — logged by the backend with the write
    return w;
  };
  const reopen = it => optimistic(it.id, { status: 'assignable', dateCompleted: '' },
    () => punchPost('updateItem', { item: { id: it.id, status: 'assignable', dateCompleted: '' } }), "Couldn't reopen");
  const saveEdit = it => optimistic(it.id, { room: it.room, item: it.item, assignee: it.assignee, notes: it.notes },
    () => punchPost('updateItem', { item: { id: it.id, room: it.room, item: it.item, assignee: it.assignee, notes: it.notes } }), "Couldn't save edit");
  const resolve = (it, newAssignee) => optimistic(it.id, { assignee: newAssignee, status: 'assignable' },
    () => punchPost('resolveFlag', { itemId: it.id, resolution: { newAssignee, newStatus: 'assignable' } }), "Couldn't resolve");
  const checkIn = async () => {
    if (!freshRef.current) return;
    setError(null); visitLocal();
    try { await withRetry(() => punchPost('checkIn', { slug })); } catch (e) { setError(`Couldn't log the visit (${e.message}).`); }
  };
  const ship = async assignee => {
    if (!freshRef.current) return;
    setError(null);
    try {
      await withRetry(() => punchPost('shipReport', { slug, assignee }));
      const now = new Date().toISOString();
      setJob(j => ({ ...j, items: j.items.map(it => it.assignee === assignee && it.status === 'assignable' ? { ...it, status: 'sent', dateSent: now } : it) }));
    } catch (e) { setError(`Couldn't mark as sent (${e.message}).`); }
  };
  const processDictation = async () => {
    if (!freshRef.current) return;
    setProcessing(true); setError(null);
    try {
      const r = await withRetry(() => punchPost('parseDictation', { dictation }));
      setPending(r.items || []); setPendingClosing(r.closingDate || null); setSheet('review');
    } catch (e) { setError(`Couldn't process dictation (${e.message}).`); }
    finally { setProcessing(false); }
  };
  const saveItems = async () => {
    if (!freshRef.current) return;
    setProcessing(true); setError(null);
    try {
      await withRetry(() => punchPost('addItems', { slug, items: pending }));
      let closingDate = job.closingDate;
      if (pendingClosing && !job.closingDate) {
        await withRetry(() => punchPost('saveJob', { job: { slug, address: job.address, closingDate: pendingClosing } }));
        closingDate = pendingClosing;
      }
      setJob(j => ({ ...j, closingDate, items: j.items.concat(pending) }));
      visitLocal(); // the backend logged this walk inside addItems
      setPending([]); setPendingClosing(null); setDictation(''); setSheet(null);
    } catch (e) { setError(`Couldn't save items (${e.message}).`); }
    finally { setProcessing(false); }
  };

  const header = embedded ? null : html`<${Header} left=${html`<${BackLink} label=${backLabel} onClick=${onBack} />`} />`;
  if (!job) {
    return html`<${React.Fragment}>${header}<div className=${embedded ? '' : 'page'}>
      ${loading ? html`<div className="empty"><${I.loader} size=${20} className="spin" /></div>`
        : html`<div className="stack"><${Notice}>${loadError || 'Something went wrong opening this walkthrough.'}<//>
            <button className="btn btn-secondary" onClick=${load}>Try again</button></div>`}
    </div><//>`;
  }

  const items = job.items || [];
  const trail = id => ptOpenTrail(job.visits, id);
  const vs = ptVisitStatus(job);
  const open = items.filter(it => it.status === 'assignable' || it.status === 'sent');
  const prieb = open.filter(it => ptIsPrieb(it.assignee));
  const flagged = items.filter(it => it.status === 'flagged');
  const mine = items.filter(it => it.status === 'self_assigned');
  const completed = items.filter(it => it.status === 'completed');
  const trades = {};
  open.filter(it => !ptIsPrieb(it.assignee)).forEach(it => { (trades[it.assignee] = trades[it.assignee] || []).push(it); });
  const sheetItem = sheet && sheet.item ? items.find(it => it.id === sheet.item) : null;
  const rows = list => html`<div className="card">${list.map(it => html`<${PtItemRow} key=${it.id} it=${it} trail=${trail(it.id)} onOpen=${id => fresh && setSheet({ item: id })} onComplete=${complete} />`)}</div>`;
  const copyPrieb = async () => {
    try { await navigator.clipboard.writeText(ptHelperList([{ address: job.address, items: prieb }])); setCopied(true); setTimeout(() => setCopied(false), 1800); }
    catch (e) { setError("Couldn't copy — your browser may be blocking clipboard access."); }
  };

  return html`<${React.Fragment}>
    ${header}
    <div className=${'pt ' + (embedded ? 'stack' : 'page stack')}>
      ${!embedded && html`<div><div className="cap">Punch list</div><h1 className="title-house">${job.address}</h1></div>`}
      ${!job.archived && html`<div className=${'card' + (vs.overdue ? ' attn' : '')}><div className="row">
        <div className="grow"><div className="row-title sm">${vs.label}</div>
          <div className=${'row-meta' + (vs.overdue ? ' attn' : '')}>${vs.overdue ? 'Needs a visit' : job.closingDate ? `Closing ${fmtShort(ptDay(job.closingDate))}` : 'No closing date in PunchTrack'}</div></div>
        <button className="btn btn-secondary btn-sm" disabled=${!fresh || vs.last === ptToday()} onClick=${checkIn}><${I.check} size=${14} />Checked today</button>
      </div></div>`}
      <div className="chips">
        <span className=${'chip' + (flagged.length ? ' attn' : '')}>${open.length + flagged.length + mine.length} open</span>
        <span className="chip">${completed.length} done</span>
      </div>
      ${!fresh && (loading ? html`<div className="cap no-print" style=${{ display: 'flex', alignItems: 'center', gap: 6 }}><${I.loader} size=${12} className="spin" />Updating — view only for a moment</div>`
        : html`<div className="stack no-print" style=${{ gap: 8 }}><${Notice}>${loadError || "Couldn't refresh."} Showing your saved copy — view only until it refreshes.<//>
            <button className="btn btn-secondary" onClick=${load}>Try again</button></div>`)}
      ${error && !sheet && html`<${Notice}>${error}<//>`}
      ${items.length === 0 && html`<${Empty} text="No punch items yet. Tap Dictate to walk the house." />`}
      ${flagged.length > 0 && html`<section><div className="section-head"><span className="label attn-text">Needs my follow-up</span><span className="hint">${flagged.length}</span></div>${rows(flagged)}</section>`}
      ${prieb.length > 0 && html`<section><div className="section-head"><span className="label">Prieb — in-house</span>
          <button className="btn btn-secondary btn-sm" onClick=${copyPrieb}><${I.copy} size=${14} />${copied ? 'Copied' : 'Copy for helper'}</button></div>${rows(prieb)}</section>`}
      ${mine.length > 0 && html`<section><div className="section-head"><span className="label">Chris — internal follow-up</span><span className="hint">${mine.length}</span></div>${rows(mine)}</section>`}
      ${Object.entries(trades).map(([who, list]) => html`<section key=${who}>
        <div className="section-head"><span className="label">${who}</span>
          <button className="btn btn-secondary btn-sm" disabled=${!fresh} onClick=${() => setSheet({ report: who })}>${list.every(it => it.status === 'sent') ? 'Sent · report' : 'Report'}</button></div>
        ${rows(list)}</section>`)}
      ${completed.length > 0 && html`<section><div className="section-head"><span className="label">Completed</span><span className="hint">${completed.length}</span></div>${rows(completed)}</section>`}
    </div>
    <div className="actionbar no-print pt"><div className="actionbar-in">
      <button className="btn btn-secondary btn-lg" disabled=${!items.length} onClick=${() => ptDownloadMarkdown(job)}><${I.external} size=${16} />Export .md</button>
      <button className="btn btn-primary btn-lg" disabled=${!fresh} onClick=${() => { setError(null); setSheet('dictate'); }}><${I.mic} size=${18} />Dictate</button>
    </div></div>
    ${sheet === 'dictate' && html`<${PtDictateSheet} dictation=${dictation} setDictation=${setDictation} processing=${processing} error=${error}
      onProcess=${processDictation} onClose=${() => setSheet(null)} />`}
    ${sheet === 'review' && html`<${PtReviewSheet} items=${pending} closingDate=${pendingClosing} saving=${processing} error=${error}
      onUpdate=${(id, f, v) => setPending(p => p.map(it => it.id === id ? { ...it, [f]: v } : it))}
      onRemove=${id => setPending(p => p.filter(it => it.id !== id))}
      onSave=${saveItems} onClose=${() => { setSheet(null); setPending([]); setPendingClosing(null); }} />`}
    ${sheetItem && html`<${PtItemSheet} key=${sheetItem.id} item=${sheetItem} trail=${trail(sheetItem.id)} onClose=${() => setSheet(null)}
      onSave=${saveEdit} onComplete=${complete} onReopen=${reopen} onResolve=${resolve} />`}
    ${sheet && sheet.report && html`<${PtReportSheet} job=${job} assignee=${sheet.report} items=${trades[sheet.report] || []}
      onShip=${ship} onClose=${() => setSheet(null)} />`}
  <//>`;
}

function slugify(address) {
  return address
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "");
}

function todayStr() {
  const d = new Date();
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}

function newId() {
  return Math.random().toString(36).slice(2, 10);
}

async function withRetry(fn, attempts = 3, delayMs = 400) {
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    try {
      return await fn();
    } catch (e) {
      lastErr = e;
      if (i < attempts - 1) {
        await new Promise((res) => setTimeout(res, delayMs * (i + 1)));
      }
    }
  }
  throw lastErr;
}

// GET requests -> read actions (listJobs, getJob)
async function backendGet(params) {
  const url = new URL(APPS_SCRIPT_URL);
  Object.entries({ token: APP_TOKEN, ...params }).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url.toString());
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

// POST requests -> write/AI actions. IMPORTANT: Content-Type must stay text/plain —
// Apps Script doesn't handle the CORS preflight that application/json triggers.
async function backendPost(action, payload) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action, token: APP_TOKEN, ...payload }),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}



const COMM_METHODS = [
  { key: "email", label: "email" },
  { key: "text", label: "text" },
  { key: "coconstruct", label: "CoConstruct" },
  { key: "call", label: "call" },
];

// Items saved before "call" existed have no communicated.call — fill in any
// missing method as not-done so every `communicated[key].done` read is safe.
function normalizeJob(job) {
  if (!job || !Array.isArray(job.items)) return job;
  return { ...job, items: job.items.map((it) => ({ ...it, communicated: { ...defaultCommunicated(), ...(it.communicated || {}) } })) };
}

// "Sep 28, 2026" / ISO / Date → "2026-09-28" (local), or null.
function toIsoDay(v) {
  if (!v) return null;
  const d = new Date(v);
  if (isNaN(d.getTime())) return null;
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
const minDay = (a, b) => (!b ? a : !a || b < a ? b : a);

// Client-side twin of Code.gs listJobSummaries(), used to refresh a job's
// counts right after editing it (no extra network call).
function summarizeJob(job) {
  const s = { slug: job.slug, address: job.address, createdAt: job.createdAt,
    notSent: 0, sent: 0, done: 0, total: 0, oldestUnsentDate: null, oldestSentNoReplyDate: null };
  job.items.forEach((it) => {
    const comms = COMM_METHODS.map(({ key }) => it.communicated[key]).filter((c) => c && c.done);
    const st = itemStatus(it);
    s.total++;
    s[st === "pending" ? "notSent" : st]++;
    if (st === "pending") s.oldestUnsentDate = minDay(s.oldestUnsentDate, toIsoDay(it.createdAt));
    if (comms.length && !it.markedOut.done) comms.forEach((c) => { s.oldestSentNoReplyDate = minDay(s.oldestSentNoReplyDate, toIsoDay(c.date)); });
  });
  return s;
}
const hasCounts = (s) => !!s && typeof s.total === "number";

function defaultCommunicated() {
  return COMM_METHODS.reduce((acc, m) => {
    acc[m.key] = { done: false, date: null };
    return acc;
  }, {});
}

function itemStatus(item) {
  const anyCommunicated = item.communicated && Object.values(item.communicated).some((m) => m.done);
  if (anyCommunicated && item.markedOut?.done) return "done";
  if (anyCommunicated || item.markedOut?.done) return "sent";
  return "pending";
}

function escapeHtml(str) {
  if (!str) return "";
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function buildPrintableHtml(job) {
  const grouped = {};
  job.categories.forEach((c) => (grouped[c] = []));

function buildPlainTextSummary(job) {
  const grouped = {};
  job.categories.forEach((c) => (grouped[c] = []));
  job.items.forEach((it) => {
    if (!grouped[it.category]) grouped[it.category] = [];
    grouped[it.category].push(it);
  });
  const nonEmptyCats = job.categories.filter((c) => grouped[c] && grouped[c].length > 0);
  let out = `${job.address} — Scope Deviation Log (${todayStr()})\n`;
  nonEmptyCats.forEach((cat) => {

    grouped[cat].forEach((it) => {

          .join(", ") || "not communicated";
      const marked = it.markedOut.done ? `marked out ${it.markedOut.date}` : "not marked out";

// ── Scope: job list (stale-while-revalidate, same rules as houses) ─
// The list is cached so the Scope tab renders instantly; a failed load keeps
// the cached copy and never overwrites it.
const SCOPE_JOBS_KEY = 'bt_scope_jobs';
function useScopeJobs() {
  const [jobs, setJobsState] = useState(() => { try { return JSON.parse(localStorage.getItem(SCOPE_JOBS_KEY)); } catch (e) { return null; } });
  const [loading, setLoading] = useState(true);
  const [failed, setFailed] = useState(false);
  const setJobs = useCallback(fn => setJobsState(prev => {
    const next = fn(prev || []);
    try { localStorage.setItem(SCOPE_JOBS_KEY, JSON.stringify(next)); } catch (e) {}
    return next;
  }), []);
  useEffect(() => {
    (async () => {
      try {
        let result;
        try {
          result = await withRetry(() => backendGet({ action: 'listJobSummaries' }));
        } catch (e) {
          // Backend not redeployed yet → no counts; the plain list still works.
          if (!/Unknown action/.test(e.message)) throw e;
          result = await withRetry(() => backendGet({ action: 'listJobs' }));
        }
        setJobs(() => Array.isArray(result) ? result : []);
      } catch (e) { setFailed(true); }
      finally { setLoading(false); }
    })();
  }, []);
  // Keep one job's counts current after it's edited on its page.
  const updateSummary = useCallback(job => setJobs(js => js.map(j => j.slug === job.slug ? summarizeJob(job) : j)), []);
  return { jobs: jobs || [], loading: loading && jobs === null, failed, setJobs, updateSummary };
}
// Houses are entered as street address only (lot in its own field), but scope
// jobs are often named "19613 W. 114th St - Lot 160". Match on the street part:
// drop anything from "lot" onward, then slugify (which also ignores "W." vs "W").
const streetKey = a => slugify(String(a || '').replace(/[\s,\-–—#(]*\blot\b.*$/i, ''));
const lotOf = a => { const m = String(a || '').match(/\blot\b\s*#?\s*(\w+)/i); return m ? m[1].toLowerCase() : null; };
function jobForHouse(h, jobs) {
  const key = streetKey(h.address);
  if (!key) return undefined;
  const hits = jobs.filter(j => streetKey(j.address) === key);
  if (hits.length <= 1) return hits[0];
  // Same street address twice (rare): let the lot number break the tie.
  const lot = String(h.lotNumber || '').toLowerCase();
  return hits.find(j => lotOf(j.address) === lot) || hits[0];
}

const shortDate = d => d ? String(d).replace(/,\s*\d{4}$/, '') : '';
function itemMeta(it) {
  const parts = [];
  if (it.sub) parts.push(it.sub);
  const comms = COMM_METHODS.filter(({ key }) => it.communicated[key] && it.communicated[key].done)
    .map(({ key, label }) => `${label} ${shortDate(it.communicated[key].date)}`.trim());
  parts.push(...comms);
  if (it.markedOut.done) parts.push(`marked out ${shortDate(it.markedOut.date)}`.trim());
  if (!comms.length && !it.markedOut.done) parts.push('not sent');
  return parts.join(' · ');
}
function printStatus(it) {
  return `${it.markedOut.done ? `Marked out ${it.markedOut.date}` : 'Not marked out'} · ${
    COMM_METHODS.filter(({ key }) => it.communicated[key] && it.communicated[key].done).map(({ label, key }) => `${label} ${it.communicated[key].date}`).join(', ') || 'Not communicated'}`;
}
