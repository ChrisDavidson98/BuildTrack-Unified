// One scope job's page. All data logic here is carried over unchanged from the
// original ScopeApp (save queue, AI intake/follow-up, toggles); only the UI moved.
// Each job is cached per device so it opens instantly. The cached copy is
// VIEW-ONLY until the fresh copy arrives: saveJob replaces every Items row for
// the job, so a save built on a stale copy could overwrite newer edits made on
// another device. `fresh` gates every write (saveJob checks freshRef too).
const scopeJobKey = slug => 'bt_scope_job_' + slug;
const readCachedJob = slug => { try { const s = localStorage.getItem(scopeJobKey(slug)); return s ? normalizeJob(JSON.parse(s)) : null; } catch (e) { return null; } };
const writeCachedJob = job => { try { localStorage.setItem(scopeJobKey(job.slug), JSON.stringify(job)); } catch (e) {} };

function ScopeJobScreen({ slug, backLabel, onBack, embedded, onChange }) {
  const [activeJob, setActiveJob] = useState(() => readCachedJob(slug));
  const [fresh, setFresh] = useState(false);
  const freshRef = useRef(false);
  const [jobLoading, setJobLoading] = useState(true);
  const [jobLoadError, setJobLoadError] = useState(null);
  const [dictation, setDictation] = useState('');
  const [mode, setMode] = useState('intake'); // intake | followup
  const [processing, setProcessing] = useState(false);
  const [error, setError] = useState(null);
  const [copyStatus, setCopyStatus] = useState(null);
  const [sheet, setSheet] = useState(null); // null | 'dictate' | 'add' | {item: id}
  const [menuOpen, setMenuOpen] = useState(false);
  const saveQueueRef = useRef(Promise.resolve());

  const loadJob = async () => {
    setJobLoading(true);
    setJobLoadError(null);
    try {
      const result = normalizeJob(await withRetry(() => backendGet({ action: 'getJob', slug })));
      setActiveJob(result);
      writeCachedJob(result);
      freshRef.current = true;
      setFresh(true);
    } catch (e) {
      setJobLoadError(`Couldn't load this job (${e.message || 'backend error'}).`);
    } finally {
      setJobLoading(false);
    }
  };
  useEffect(() => { loadJob(); }, [slug]);

  // Saves must (a) always build on the latest job state, even if several
  // edits happen back-to-back before any network round-trip completes, and
  // (b) reach the backend in order, one at a time — otherwise a later save
  // computed from stale state can land after an earlier one and silently
  // overwrite it (saveJob on the backend fully replaces a job's Items rows).
  // The functional setActiveJob form guarantees (a); chaining onto
  // saveQueueRef guarantees (b).
  const saveJob = (updater) => {
    if (!freshRef.current) return; // never save on top of the cached (possibly stale) copy
    setActiveJob((prev) => {
      const base = typeof updater === 'function' ? updater(prev) : updater;
      const updated = { ...base, lastUpdated: new Date().toISOString() };
      writeCachedJob(updated);
      saveQueueRef.current = saveQueueRef.current
        .then(() => withRetry(() => backendPost('saveJob', { job: updated })))
        .catch(() => setError("Couldn't save changes."));
      return updated;
    });
  };

  const processIntake = async () => {
    if (!dictation.trim() || !activeJob) return;
    setProcessing(true);
    setError(null);
    try {
      const result = await withRetry(() => backendPost('parseIntake', { dictation, categories: activeJob.categories }));
      const items = (Array.isArray(result) ? result : []).map((r) => ({
        id: newId(),
        category: r.category || 'General',
        sub: r.sub || null,
        item: r.item || '',
        source: r.source || null,
        notes: r.notes || null,
        markedOut: { done: false, date: null },
        communicated: defaultCommunicated(),
        createdAt: new Date().toISOString(),
      }));
      saveJob((prev) => {
        const mergedCategories = [...prev.categories];
        items.forEach((it) => { if (!mergedCategories.includes(it.category)) mergedCategories.push(it.category); });
        return { ...prev, categories: mergedCategories, items: [...prev.items, ...items] };
      });
      setDictation('');
      setSheet(null);
    } catch (e) {
      setError(`Couldn't process that (${e.message || 'unknown error'}) — try again, or add items manually.`);
    } finally {
      setProcessing(false);
    }
  };

  const processFollowup = async () => {
    if (!dictation.trim() || !activeJob) return;
    setProcessing(true);
    setError(null);
    try {
      const itemSummaries = activeJob.items.map((it) => ({
        id: it.id, category: it.category, sub: it.sub, item: it.item,
        markedOut: it.markedOut.done,
        communicated: Object.fromEntries(Object.entries(it.communicated).map(([k, v]) => [k, v.done])),
      }));
      const result = await withRetry(() => backendPost('parseFollowup', { dictation, itemSummaries }));
      const updates = result.updates || [];
      saveJob((prev) => ({
        ...prev,
        items: prev.items.map((it) => {
          const u = updates.find((x) => x.id === it.id);
          if (!u) return it;
          const next = { ...it };
          if (u.markedOut !== undefined) {
            next.markedOut = { done: u.markedOut, date: u.markedOut ? todayStr() : it.markedOut.date };
          }
          if (Array.isArray(u.communicatedMethods) && u.communicatedMethods.length) {
            next.communicated = { ...next.communicated };
            u.communicatedMethods.forEach((m) => {
              if (next.communicated[m]) next.communicated[m] = { done: true, date: todayStr() };
            });
          }
          if (u.note) next.notes = next.notes ? `${next.notes} — ${u.note}` : u.note;
          return next;
        }),
      }));
      if (result.unmatched && result.unmatched.length) {
        setError(`Some things weren't matched to an existing item: ${result.unmatched.join('; ')}`);
      } else {
        setSheet(null);
      }
      setDictation('');
    } catch (e) {
      setError(`Couldn't process that (${e.message || 'unknown error'}) — try again.`);
    } finally {
      setProcessing(false);
    }
  };

  const toggleMarkedOut = (id) => {
    saveJob((prev) => ({
      ...prev,
      items: prev.items.map((it) =>
        it.id === id ? { ...it, markedOut: { done: !it.markedOut.done, date: !it.markedOut.done ? todayStr() : it.markedOut.date } } : it),
    }));
  };
  const toggleCommunicated = (id, method) => {
    saveJob((prev) => ({
      ...prev,
      items: prev.items.map((it) => {
        if (it.id !== id) return it;
        const current = it.communicated[method];
        return { ...it, communicated: { ...it.communicated, [method]: { done: !current.done, date: !current.done ? todayStr() : current.date } } };
      }),
    }));
  };
  const deleteItem = (id) => saveJob((prev) => ({ ...prev, items: prev.items.filter((it) => it.id !== id) }));
  const editItem = (id, updates) => saveJob((prev) => ({ ...prev, items: prev.items.map((it) => (it.id === id ? { ...it, ...updates } : it)) }));
  const addManualItem = (category, item, sub) => {
    if (!item.trim()) return;
    const newItem = {
      id: newId(), category, sub: sub || null, item: item.trim(), source: null, notes: null,
      markedOut: { done: false, date: null }, communicated: defaultCommunicated(), createdAt: new Date().toISOString(),
    };
    saveJob((prev) => ({ ...prev, items: [...prev.items, newItem] }));
  };

  const handleExport = () => {
    setMenuOpen(false);
    try {
      const page = buildPrintableHtml(activeJob);
      const url = URL.createObjectURL(new Blob([page], { type: 'text/html' }));
      if (!window.open(url, '_blank')) setError('Pop-up blocked — allow pop-ups for this page, or use Copy summary instead.');
    } catch (e) {
      setError('Export failed to open — try Copy summary instead.');
    }
  };
  const handleCopySummary = async () => {
    setMenuOpen(false);
    try {
      await navigator.clipboard.writeText(buildPlainTextSummary(activeJob));
      setCopyStatus('Copied');
      setTimeout(() => setCopyStatus(null), 2000);
    } catch (e) {
      setError("Couldn't copy — your browser may be blocking clipboard access.");
    }
  };

  // Let the parent refresh this job's counts (Today rings, tab badges) after edits.
  useEffect(() => { if (activeJob && onChange) onChange(activeJob); }, [activeJob]);

  const moreBtn = html`${copyStatus && html`<span className="sync ok"><span className="sync-dot" />${copyStatus}</span>`}
    ${activeJob && html`<button className="icon-btn" aria-label="More actions" aria-expanded=${menuOpen} onClick=${() => setMenuOpen(o => !o)}><${I.more} size=${20} /></button>`}`;
  // Embedded = shown as the Scope tab of a house page, which supplies its own header/title.
  const header = embedded ? null : html`<${Header} left=${html`<${BackLink} label=${backLabel} onClick=${onBack} />`} right=${moreBtn} />`;

  if (!activeJob) {
    return html`<${React.Fragment}>${header}<div className=${embedded ? '' : 'page'}>
      ${jobLoading ? html`<div className="empty"><${I.loader} size=${20} className="spin" /></div>`
        : html`<div className="stack"><${Notice}>${jobLoadError || 'Something went wrong opening this job.'}<//>
            <button className="btn btn-secondary" onClick=${loadJob}>Try again</button></div>`}
    </div><//>`;
  }

  const job = activeJob;
  const grouped = {};
  job.categories.forEach((c) => (grouped[c] = []));
  job.items.forEach((it) => { if (!grouped[it.category]) grouped[it.category] = []; grouped[it.category].push(it); });
  const nonEmptyCats = job.categories.filter((c) => grouped[c] && grouped[c].length > 0);
  const counts = { pending: 0, sent: 0, done: 0 };
  job.items.forEach(it => counts[itemStatus(it)]++);
  const sheetItem = sheet && sheet.item ? job.items.find(it => it.id === sheet.item) : null;

  return html`<${React.Fragment}>
    ${header}
    ${menuOpen && html`<div className="no-print" style=${{ position: 'fixed', inset: 0, zIndex: 65 }} onClick=${() => setMenuOpen(false)} />
      <div className="menu no-print" style=${embedded ? { position: 'fixed', top: 'auto', bottom: 'calc(84px + var(--safe-b))' } : undefined}>
        <button onClick=${handleCopySummary}><${I.copy} size=${16} />Copy summary</button>
        <button onClick=${handleExport}><${I.printer} size=${16} />Export / print</button>
      </div>`}
    <div className=${embedded ? 'stack' : 'page stack'}>
      <div className="print-only"><div className="cap">SCOPE DEVIATION LOG</div><h1 className="title-house">${job.address}</h1><div className="cap">Printed ${todayStr()}</div></div>
      ${!embedded && html`<div className="no-print"><div className="cap">Scope deviations</div><h1 className="title-house">${job.address}</h1></div>`}
      <div className="between no-print">
        <div className="chips">
          <span className=${'chip' + (counts.pending ? ' attn' : '')}>${counts.pending} not sent</span>
          <span className="chip">${counts.sent} sent</span>
          <span className="chip">${counts.done} done</span>
        </div>
        ${embedded && html`<div className="hdr-right">${moreBtn}</div>`}
      </div>
      ${!fresh && (jobLoading ? html`<div className="cap no-print" style=${{ display: 'flex', alignItems: 'center', gap: 6 }}><${I.loader} size=${12} className="spin" />Updating — view only for a moment</div>`
        : html`<div className="stack no-print" style=${{ gap: 8 }}><${Notice}>${jobLoadError || "Couldn't refresh."} Showing your saved copy — view only until it refreshes.<//>
            <button className="btn btn-secondary" onClick=${loadJob}>Try again</button></div>`)}
      ${error && !sheet && html`<${Notice}>${error}<//>`}
      ${nonEmptyCats.length === 0 ? html`<${Empty} text="No items yet. Tap Dictate to read through the contract, or Add item." />`
        : nonEmptyCats.map(cat => {
          const items = grouped[cat];
          const anyPending = items.some(it => itemStatus(it) === 'pending');
          return html`<section key=${cat}>
            <div className="section-head"><span className="label">${cat}</span><span className="hint">${items.length}</span></div>
            <div className=${'card' + (anyPending ? ' attn' : '')}>
              ${items.map(it => { const st = itemStatus(it); return html`
                <div key=${it.id} className=${'row tap' + (st === 'done' ? ' item-done' : '')} onClick=${() => fresh && setSheet({ item: it.id })}>
                  <span className=${'chk ' + st} aria-label=${st === 'pending' ? 'not sent' : st}>${st === 'done' && html`<${I.check} size=${14} strokeWidth=${3} />`}</span>
                  <div className="grow">
                    <div className="row-title sm">${it.item}</div>
                    <div className=${'row-meta no-print' + (st === 'pending' ? ' attn' : '')}>${itemMeta(it)}</div>
                    ${it.notes && html`<div className="row-meta" style=${{ fontStyle: 'italic' }}>${it.notes}</div>`}
                    <div className="row-meta print-only">${printStatus(it)}</div>
                  </div>
                </div>`; })}
            </div>
          </section>`;
        })}
    </div>
    <div className="actionbar no-print"><div className="actionbar-in">
      <button className="btn btn-secondary btn-lg" disabled=${!fresh} onClick=${() => setSheet('add')}><${I.plus} size=${18} />Add item</button>
      <button className="btn btn-primary btn-lg" disabled=${!fresh} onClick=${() => { setError(null); setSheet('dictate'); }}><${I.mic} size=${18} />Dictate</button>
    </div></div>
    ${sheet === 'dictate' && html`<${DictateSheet} mode=${mode} setMode=${setMode} dictation=${dictation} setDictation=${setDictation}
      processing=${processing} error=${error} onProcess=${mode === 'intake' ? processIntake : processFollowup} onClose=${() => setSheet(null)} />`}
    ${sheet === 'add' && html`<${AddItemSheet} categories=${job.categories} onAdd=${addManualItem} onClose=${() => setSheet(null)} />`}
    ${sheetItem && html`<${ItemSheet} key=${sheetItem.id} item=${sheetItem} onClose=${() => setSheet(null)}
      onToggleMarkedOut=${toggleMarkedOut} onToggleCommunicated=${toggleCommunicated} onEdit=${editItem} onDelete=${deleteItem} />`}
  <//>`;
}

// ── Houses: stale-while-revalidate ───────────────────────────────
// Render the localStorage copy immediately, fetch the sheet in the background,
// and swap in the fresh copy when it arrives. Rules that keep this safe:
//  - A failed/errored load never touches localStorage or the sheet (sheetsLoad
//    throws on {error}, per the 2026-08-18 fix) — we just keep showing the cache.
//  - Loading is not an edit: data that arrived from the sheet is never saved
//    straight back to it. Only real user edits trigger a save.
//  - Edits made while the load is still in flight are replayed on top of the
//    fresh sheet data (every edit is an id-based updater function), so a stale
//    cache can't overwrite newer sheet data from another device.
//  - Never save to the sheet without a baseline (a cached copy from an earlier
//    session, or a successful load this session). Otherwise a brand-new device
//    whose first load failed could overwrite the whole sheet with only the
//    house(s) added while offline.
function readCachedHouses() {
  try { const s = localStorage.getItem('bt'); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}
function writeCachedHouses(houses) {
  try { localStorage.setItem('bt', JSON.stringify(houses)); } catch (e) {}
}

function useHouses() {
  const [houses, setHousesState] = useState(readCachedHouses); // null = first run, nothing cached
  const [remoteDone, setRemoteDone] = useState(!configured());
  const [sync, setSync] = useState('idle'); // idle | saving | error | offline
  const [updatedAt, setUpdatedAt] = useState(null); // last successful load or save
  const remoteDoneRef = useRef(!configured());
  const pending = useRef([]);   // edits made before the sheet load finished
  const dirty = useRef(false);  // true once the user has edited since the last save
  const timer = useRef(null);
  const hasBaseline = useRef(houses !== null);

  useEffect(() => {
    if (!configured()) return;
    (async () => {
      try {
        const data = await sheetsLoad();
        if (!data) throw new Error('Malformed response');
        hasBaseline.current = true;
        const merged = pending.current.reduce((acc, fn) => fn(acc), data);
        setHousesState(merged);
        writeCachedHouses(merged);
        setSync('idle'); setUpdatedAt(new Date());
      } catch (e) {
        setSync('offline');
        setHousesState(h => h || []);
      }
      pending.current = [];
      remoteDoneRef.current = true;
      setRemoteDone(true);
    })();
  }, []);

  const setHouses = useCallback(fn => {
    dirty.current = true;
    if (!remoteDoneRef.current) pending.current.push(fn);
    setHousesState(p => fn(p || []));
  }, []);

  useEffect(() => {
    if (!remoteDone || !dirty.current || !houses) return;
    // No baseline: don't cache either — a cache counts as a baseline next launch.
    if (configured() && !hasBaseline.current) { setSync('offline'); return; }
    writeCachedHouses(houses);
    if (!configured()) return;
    clearTimeout(timer.current);
    setSync('saving');
    timer.current = setTimeout(async () => {
      try {
        await sheetsSave(houses);
        dirty.current = false;
        setSync('idle'); setUpdatedAt(new Date());
      } catch (e) { setSync('error'); }
    }, 1500);
    return () => clearTimeout(timer.current);
  }, [houses, remoteDone]);

  return { houses: houses || [], ready: houses !== null, sync, loading: !remoteDone, updatedAt, setHouses };
}

// ── Shell: bottom tabs + detail routes ───────────────────────────
// tab   = which bottom tab is showing (today | houses | scope | punch | bonuses)
// route = a full-screen detail page opened from a tab, or null:
//         { type: 'house', id, view: 'milestones'|'scope'|'punch' } | { type: 'job', slug } | { type: 'punchjob', slug }
// Back from a detail page always returns to the tab it was opened from.
const TAB_LABELS = { today: 'Today', houses: 'Houses', scope: 'Scope', punch: 'Punch', bonuses: 'Bonuses' };

function Shell() {
  const [tab, setTab] = useState('today');
  const [route, setRoute] = useState(null);
  const [houseFilter, setHouseFilter] = useState('active');
  const [sortBy, setSortBy] = useState('entry');
  const [showAdd, setShowAdd] = useState(false);
  const [showSearch, setShowSearch] = useState(false);
  // Both backends load in parallel on startup (two independent effects).
  const { houses, ready, sync, loading, updatedAt, setHouses } = useHouses();
  const scope = useScopeJobs();
  const punch = usePunchJobs();

  useEffect(() => { window.scrollTo(0, 0); }, [tab, route]);

  // Deep-link support: ?house=<id> or ?scope=<slug> in the URL (set by the
  // Portfolio Dashboard) opens that record on load. ?house opens immediately;
  // ?scope waits for the job list so a job with a matching house opens on that
  // house's Scope tab (same as tapping it in the Scope list). Purely additive —
  // normal navigation is unaffected when neither parameter is present.
  const deepLinkDone = useRef(false);
  useEffect(() => {
    if (deepLinkDone.current) return;
    const params = new URLSearchParams(window.location.search);
    const houseId = params.get('house'), scopeSlug = params.get('scope');
    if (houseId) { deepLinkDone.current = true; setRoute({ type: 'house', id: houseId, view: 'milestones' }); return; }
    if (!scopeSlug) { deepLinkDone.current = true; return; }
    if (scope.loading) return; // job list not in yet — re-runs when it arrives
    deepLinkDone.current = true;
    setTab('scope');
    openJob(scopeSlug);
  }, [scope.loading]);

  const addHouse = d => {
    setHouses(p => [...p, { id: genId(), address: d.address, lotNumber: d.lotNumber, subdivision: d.subdivision, basementFinish: d.basementFinish, notes: '', milestones: {}, bonuses: { roughIn: false, co: false, closing: false, basement: false }, archived: false }]);
    setShowAdd(false);
  };
  const upM  = (id, k, v) => setHouses(p => p.map(h => h.id === id ? { ...h, milestones: { ...h.milestones, [k]: v } } : h));
  const upH  = (id, u)    => setHouses(p => p.map(h => h.id === id ? { ...h, ...u } : h));
  const togB = (id, bk)   => setHouses(p => p.map(h => h.id === id ? { ...h, bonuses: { ...h.bonuses, [bk]: !h.bonuses[bk] } } : h));
  const arch = id => { setHouses(p => p.map(h => h.id === id ? { ...h, archived: true } : h)); setRoute(null); };
  const del  = id => { setHouses(p => p.filter(h => h.id !== id)); setRoute(null); };

  // Creates the scope job. Never automatic — only from an explicit button (CLAUDE.md).
  const createJob = async (address) => {
    const slug = slugify(address) + '-' + newId().slice(0, 4);
    const job = { slug, address, createdAt: new Date().toISOString(), categories: [...DEFAULT_CATEGORIES], items: [] };
    await withRetry(() => backendPost('createJob', { job }));
    scope.setJobs(js => [summarizeJob(job), ...js]);
    return slug;
  };
  const deleteJob = async (slug) => {
    await withRetry(() => backendPost('deleteJob', { slug }));
    scope.setJobs(js => js.filter(j => j.slug !== slug));
    try { localStorage.removeItem(scopeJobKey(slug)); } catch (e) {}
  };

  // Starts the PunchTrack walkthrough for a house. Never automatic — only from
  // the Start walkthrough button. Carries the house's closing date across so the
  // trade-report deadline and the visit rule work from day one.
  const createPunch = async (h) => {
    const job = { slug: slugify(h.address) + '-' + newId().slice(0, 4), address: h.address, closingDate: h.milestones.closing || '',
      createdAt: new Date().toISOString(), lastUpdated: new Date().toISOString() };
    await withRetry(() => punchPost('createJob', { job }));
    punch.setJobs(js => [{ ...job, archived: '', lastVisit: '', total: 0, done: 0, open: 0 }, ...js]);
  };

  const active = houses.filter(h => !h.archived);
  const openHouse = (id, view = 'milestones') => { setShowSearch(false); setRoute({ type: 'house', id, view }); };
  // A scope job opens on its house's Scope tab when a house matches by address;
  // otherwise as a standalone scope page.
  const openJob = slug => {
    const j = scope.jobs.find(x => x.slug === slug);
    const h = j && (active.find(x => jobForHouse(x, scope.jobs) === j) || houses.find(x => jobForHouse(x, scope.jobs) === j));
    setRoute(h ? { type: 'house', id: h.id, view: 'scope' } : { type: 'job', slug });
  };
  // Same for a walkthrough: its house's Punch tab when one matches, else standalone.
  const openPunch = slug => {
    const j = punch.jobs.find(x => x.slug === slug);
    const h = j && (active.find(x => punchForHouse(x, punch.jobs) === j) || houses.find(x => punchForHouse(x, punch.jobs) === j));
    setRoute(h ? { type: 'house', id: h.id, view: 'punch' } : { type: 'punchjob', slug });
  };
  const back = () => setRoute(null);
  const syncBadge = html`<${SyncBadge} sync=${sync} loading=${loading} updatedAt=${updatedAt} />`;

  // First run on this device (nothing cached yet): the only time we block on the network.
  if (!ready) {
    return html`<div className="app"><${Header} left=${html`<${Logo} />`} right=${syncBadge} />
      <div className="empty"><${I.loader} size=${20} className="spin" /></div></div>`;
  }

  if (route && route.type === 'house') {
    const h = houses.find(x => x.id === route.id);
    if (!h) { setTimeout(back); return null; }
    const sj = jobForHouse(h, scope.jobs);
    const pj = punchForHouse(h, punch.jobs);
    const view = route.view || 'milestones';
    const setView = v => setRoute(r => ({ ...r, view: v }));
    const scopeEl = sj
      ? html`<${ScopeJobScreen} key=${sj.slug} slug=${sj.slug} embedded onChange=${scope.updateSummary} />`
      : html`<${StartScope} address=${h.address} loading=${scope.loading} onStart=${() => createJob(h.address)} />`;
    const punchEl = pj
      ? html`<${PunchJobScreen} key=${pj.slug} slug=${pj.slug} embedded onChange=${punch.updateSummary} />`
      : html`<${StartPunch} house=${h} loading=${punch.loading} onStart=${() => createPunch(h)} />`;
    return html`<div className=${'app' + ((view === 'scope' && sj) || (view === 'punch' && pj) ? ' has-actions' : '')}>
      <${Header} left=${html`<${BackLink} label=${TAB_LABELS[tab]} onClick=${back} />`}
        right=${html`<${SyncBadge} sync=${sync} loading=${loading} updatedAt=${updatedAt} compact /><span className="hdr-meta">${h.subdivision || ''}</span>`} />
      <${HousePage} house=${h} sj=${sj} pj=${pj} punch=${punchEl} view=${view} setView=${setView} onUpdateHouse=${u => upH(h.id, u)} scope=${scopeEl}
        milestones=${html`<${HouseScreen} house=${h} onUpdate=${(k, v) => upM(h.id, k, v)} onUpdateHouse=${u => upH(h.id, u)} onToggleBonus=${k => togB(h.id, k)}
          onArchive=${() => arch(h.id)} onDelete=${() => del(h.id)} />`} />
    </div>`;
  }

  if (route && route.type === 'punchjob') {
    return html`<div className="app has-actions">
      <${PunchJobScreen} key=${route.slug} slug=${route.slug} backLabel=${TAB_LABELS[tab]} onBack=${back} onChange=${punch.updateSummary} />
    </div>`;
  }

  if (route && route.type === 'job') {
    return html`<div className="app has-actions">
      <${ScopeJobScreen} key=${route.slug} slug=${route.slug} backLabel=${TAB_LABELS[tab]} onBack=${back} onChange=${scope.updateSummary} />
    </div>`;
  }

  return html`<div className="app has-tabs">
    <${Header} left=${html`<${Logo} />`} right=${html`${syncBadge}${tab === 'today' && html`<button className="icon-btn" aria-label="Search houses" onClick=${() => setShowSearch(true)}><${I.search} size=${20} /></button>`}`} />
    ${tab === 'today'   && html`<${TodayScreen} houses=${active} jobs=${scope.jobs} punchJobs=${punch.jobs} onOpen=${openHouse} />`}
    ${tab === 'houses'  && html`<${HousesScreen} houses=${houses} filter=${houseFilter} setFilter=${setHouseFilter} sortBy=${sortBy} setSortBy=${setSortBy}
                              onOpen=${openHouse} onAdd=${() => setShowAdd(true)} onRestore=${id => upH(id, { archived: false })} />`}
    ${tab === 'scope'   && html`<${ScopeListScreen} jobs=${scope.jobs} loading=${scope.loading} failed=${scope.failed}
                              onOpen=${openJob} onCreate=${async a => openJob(await createJob(a))} onDelete=${deleteJob} />`}
    ${tab === 'punch'   && html`<${PunchScreen} jobs=${punch.jobs} loading=${punch.loading} failed=${punch.failed} onOpen=${openPunch} />`}
    ${tab === 'bonuses' && html`<${BonusesScreen} houses=${active} onOpen=${openHouse} onToggleBonus=${togB} />`}
    <${TabBar} tab=${tab} onTab=${setTab} />
    ${showAdd && html`<${AddHouseSheet} onAdd=${addHouse} onClose=${() => setShowAdd(false)} />`}
    ${showSearch && html`<${SearchSheet} houses=${houses} onOpen=${openHouse} onClose=${() => setShowSearch(false)} />`}
  </div>`;
}

// House has no scope job yet: offer to start one (never auto-created).
function StartScope({ address, loading, onStart }) {
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  if (loading) return html`<div className="empty"><${I.loader} size=${20} className="spin" /></div>`;
  const start = async () => {
    setBusy(true); setError(null);
    try { await onStart(); } catch (e) { setError("Couldn't create the scope log."); setBusy(false); }
  };
  return html`<div className="panel stack" style=${{ gap: 14 }}>
    <div className="cap">No scope log for ${address} yet.</div>
    ${error && html`<${Notice}>${error}<//>`}
    <button className="btn btn-primary btn-lg" disabled=${busy} onClick=${start}>${busy && html`<${I.loader} size=${16} className="spin" />`}Start scope log</button>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${Shell} />`);
</script>
</body>
</html>
